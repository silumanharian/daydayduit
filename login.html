
<!DOCTYPE html>
<html lang="id">
<head>
    <script>
    if(sessionStorage.getItem("login") === "true"){
        window.location.href = "index.html";
    }
    </script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="shortcut icon" type="image/png" href="https://i.postimg.cc/fTmvxL5n/fc.png" />
<title>LOGIN DULU YA</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    radial-gradient(circle at top left,#4f46e5 0%,transparent 30%),
    radial-gradient(circle at top right,#06b6d4 0%,transparent 25%),
    linear-gradient(135deg,#0f172a,#1e293b);

    font-family:'Inter',sans-serif;
}

.login-box{
    width:100%;
    max-width:420px;

    background:rgba(255,255,255,.08);
    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.1);

    border-radius:25px;

    padding:40px;

    box-shadow:
    0 10px 40px rgba(0,0,0,.3);
}

.logo{
    text-align:center;
    font-size:60px;
    margin-bottom:15px;
}

.title{
    text-align:center;
    color:#fff;
    font-size:30px;
    font-weight:800;
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    color:#94a3b8;
    margin-bottom:30px;
}

.form-control{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.1);
    color:#fff;
    min-height:52px;
    border-radius:14px;
}

.form-control:focus{
    background:rgba(255,255,255,.12);
    color:#fff;
    border-color:#3b82f6;
    box-shadow:0 0 0 4px rgba(59,130,246,.2);
}

.form-control::placeholder{
    color:#94a3b8;
}

.btn-login{
    width:100%;
    min-height:52px;
    border:none;
    border-radius:14px;

    font-weight:700;

    background:
    linear-gradient(
    135deg,
    #3b82f6,
    #2563eb
    );

    color:white;
}

.btn-login:hover{
    opacity:.95;
}

.footer{
    text-align:center;
    color:#94a3b8;
    margin-top:20px;
    font-size:13px;
}

@media(max-width:768px){

.login-box{
    margin:20px;
    padding:30px 20px;
}

.title{
    font-size:24px;
}

.logo{
    font-size:50px;
}

}
.footer a{
    color:#60a5fa;
    text-decoration:none;
    transition:.3s;
}

.footer a:hover{
    color:#93c5fd;
}


</style>
</head>
<body>

<div class="login-box">

    <div class="text-center mb-3">
    <img src="https://i.postimg.cc/fTmvxL5n/fc.png" alt="Logo" style="width:120px;height:auto;">
        </div>
        
        <div class="title">
            LOGIN Dashboard
        </div>

    <div class="subtitle">
        Login untuk melanjutkan
    </div>

    <input
        type="text"
        id="username"
        class="form-control mb-3"
        placeholder="Username">

    <input
        type="password"
        id="password"
        class="form-control mb-4"
        placeholder="Password">

    <button
        class="btn-login"
        onclick="login()">
        LOGIN
    </button>

    
<div class="footer">

    Personal Finance Tracker

    <div style="margin-top:12px;">

        Belum punya akun?

        <a href="regis.html"
           style="
           color:#60a5fa;
           text-decoration:none;
           font-weight:600;">
           Daftar Disini
        </a>

    </div>

</div>



</div>

<script>

function login(){

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value.trim();

    if(
        username === "admin" &&
        password === "123456"
    ){

        sessionStorage.setItem("login","true");

        window.location.href = "index.html";

    }else{

        alert("Username atau Password salah");

    }

}

</script>

</body>
</html>
