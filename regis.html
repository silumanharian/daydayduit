
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    radial-gradient(circle at top left,#4f46e5 0%,transparent 30%),
    radial-gradient(circle at top right,#06b6d4 0%,transparent 25%),
    linear-gradient(135deg,#0f172a,#1e293b);

    font-family:Inter,sans-serif;
}

.register-box{
    width:100%;
    max-width:450px;
    padding:40px;

    border-radius:24px;

    background:rgba(255,255,255,.08);
    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.1);
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    width:100px;
    height:100px;
    object-fit:contain;
}

.title{
    color:#fff;
    text-align:center;
    font-size:30px;
    font-weight:800;
    margin-bottom:10px;
}

.subtitle{
    color:#94a3b8;
    text-align:center;
    margin-bottom:30px;
}

.form-control{
    min-height:52px;
    border-radius:14px;

    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.1);
    color:#fff;
}

.form-control:focus{
    background:rgba(255,255,255,.12);
    color:#fff;
}

.btn-register{
    width:100%;
    min-height:52px;
    border:none;
    border-radius:14px;

    background:linear-gradient(135deg,#22c55e,#16a34a);

    color:#fff;
    font-weight:700;
}

.footer{
    text-align:center;
    margin-top:15px;
}

.footer a{
    color:#60a5fa;
    text-decoration:none;
}
</style>
</head>
<body>

<div class="register-box">

    <div class="logo">
        <img src="https://i.postimg.cc/fTmvxL5n/fc.png">
    </div>

    <div class="title">
        Register
    </div>

    <div class="subtitle">
        Buat akun baru
    </div>

    <input
        type="text"
        id="username"
        class="form-control mb-3"
        placeholder="Username">

    <input
        type="password"
        id="password"
        class="form-control mb-3"
        placeholder="Password">

    <button
        class="btn-register"
        onclick="registerUser()">
        DAFTAR
    </button>

    <div class="footer">
        <a href="login.html">
            Sudah punya akun? Login
        </a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const db = window.supabase.createClient(
    "https://gzjfhtmtunxjcpawoaft.supabase.co",
    "sb_publishable_qfKiFBmjU4VuC4wbd_j7sg_tRUY_9nT"
);

import { createClient } from '@supabase/supabase-js'
const supabaseUrl = 'https://gzjfhtmtunxjcpawoaft.supabase.co'
const supabaseKey = process.env.SUPABASE_KEY
const supabase = createClient(supabaseUrl, supabaseKey)
    
async function registerUser(){

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value.trim();

    if(!username || !password){
        alert("Lengkapi data");
        return;
    }

    const { error } = await db
        .from("users")
        .insert([{
            username,
            password
        }]);

    if(error){
        alert(error.message);
        return;
    }

    alert("Registrasi berhasil");

    window.location.href =
        "login.html";
}
</script>

</body>
</html>
